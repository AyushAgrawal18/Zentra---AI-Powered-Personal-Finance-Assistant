<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zentra Auth Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Zentra Auth Playground</h1>

    <section class="tabs">
      <button class="tab active" data-tab="register">Register</button>
      <button class="tab" data-tab="login">Login</button>
      <button class="tab" data-tab="refresh">Refresh</button>
      <button class="tab" data-tab="me">Me</button>
    </section>

    <!-- Register -->
    <section id="register" class="panel active">
      <h2>Create Account</h2>
      <form id="registerForm" class="form">
        <input type="text" name="fullName" placeholder="Full Name" required />
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password (min 8, upper+lower+num+special)" required />
        <button type="submit">Register</button>
      </form>
    </section>

    <!-- Login -->
    <section id="login" class="panel">
      <h2>Sign In</h2>
      <form id="loginForm" class="form">
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
    </section>

    <!-- Refresh -->
    <section id="refresh" class="panel">
      <h2>Refresh Token</h2>
      <form id="refreshForm" class="form">
        <input type="text" name="refreshToken" placeholder="Paste refresh token (or leave blank to use stored)" />
        <button type="submit">Refresh</button>
      </form>
    </section>

    <!-- Me + Logout -->
    <section id="me" class="panel">
      <h2>Current User</h2>
      <div class="btn-group">
        <button id="meBtn">Get Me</button>
        <button id="logoutBtn">Logout</button>
      </div>
    </section>

    <!-- Output -->
    <pre id="output" class="output"></pre>
  </main>
  <script src="app.js"></script>
</body>
</html>
